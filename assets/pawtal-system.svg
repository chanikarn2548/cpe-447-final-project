<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect x="0" y="0" width="1440" height="900" rx="15" fill="#fffaf1"/><text x="55" y="70" font-family="Tahoma, sans-serif" font-size="44" fill="#38263e">Pawtal  |  System Diagram</text><text x="55" y="116" font-family="Tahoma, sans-serif" font-size="29" fill="#38263e">องค์ประกอบและทิศทางข้อมูลของระบบค้นหาสัตว์เลี้ยงหาย</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#806286"/></marker></defs><rect x="50" y="165" width="540" height="108" rx="15" fill="#fae2a1"/><text x="70" y="205" font-family="Tahoma, sans-serif" font-size="28" fill="#38263e">เว็บ Pawtal</text><text x="70" y="243" font-family="Tahoma, sans-serif" font-size="22" fill="#38263e">ผู้ใช้ส่งรูปสัตว์ • หน้าเดโมรับภาพและจุดโซน</text><rect x="810" y="165" width="580" height="108" rx="15" fill="#fae2a1"/><text x="830" y="205" font-family="Tahoma, sans-serif" font-size="28" fill="#38263e">ประกาศที่เข้าถึงได้</text><text x="830" y="243" font-family="Tahoma, sans-serif" font-size="22" fill="#38263e">เว็บสาธารณะและข้อมูลจากแหล่งที่รองรับ</text><rect x="410" y="330" width="620" height="100" rx="15" fill="#e9dff0"/><text x="430" y="370" font-family="Tahoma, sans-serif" font-size="28" fill="#38263e">Node.js API</text><text x="430" y="408" font-family="Tahoma, sans-serif" font-size="22" fill="#38263e">POST /api/detect-pets   •   POST /api/search-all</text><path d="M320 273 V305 H565 V327" fill="none" stroke="#806286" stroke-width="4" marker-end="url(#a)"/><path d="M1100 273 V305 H890 V327" fill="none" stroke="#806286" stroke-width="4" marker-end="url(#a)"/><rect x="50" y="500" width="400" height="112" rx="15" fill="#dff1e6"/><text x="70" y="540" font-family="Tahoma, sans-serif" font-size="28" fill="#38263e">โมเดลตรวจจับสัตว์</text><text x="70" y="578" font-family="Tahoma, sans-serif" font-size="22" fill="#38263e">YOLO11n / ONNX → กรอบและชนิด</text><rect x="510" y="500" width="420" height="112" rx="15" fill="#dff1e6"/><text x="530" y="540" font-family="Tahoma, sans-serif" font-size="28" fill="#38263e">โมเดลเปรียบเทียบภาพ</text><text x="530" y="578" font-family="Tahoma, sans-serif" font-size="19" fill="#38263e">ครอปภาพ → สกัดเวกเตอร์ → เทียบความคล้าย</text><rect x="990" y="500" width="400" height="112" rx="15" fill="#f7ead2"/><text x="1010" y="540" font-family="Tahoma, sans-serif" font-size="28" fill="#38263e">ฐานข้อมูลและไฟล์ภาพ</text><text x="1010" y="578" font-family="Tahoma, sans-serif" font-size="18" fill="#38263e">SQLite: เคส + แคชเวกเตอร์ • รูปใน uploads</text><path d="M560 430 V458 H250 V498" fill="none" stroke="#806286" stroke-width="4" marker-end="url(#a)"/><path d="M720 430 V498" fill="none" stroke="#806286" stroke-width="4" marker-end="url(#a)"/><path d="M1190 500 V458 H900 V432" marker-start="url(#a)" fill="none" stroke="#806286" stroke-width="4" marker-end="url(#a)"/><rect x="50" y="712" width="520" height="115" rx="15" fill="#e9dff0"/><text x="70" y="752" font-family="Tahoma, sans-serif" font-size="28" fill="#38263e">เบราว์เซอร์ · detect.js + zone.js</text><text x="70" y="790" font-family="Tahoma, sans-serif" font-size="22" fill="#38263e">เทียบจุดกลางกรอบกับโซน 5 มุม → IN / OUT</text><rect x="680" y="712" width="710" height="115" rx="15" fill="#e9dff0"/><text x="700" y="752" font-family="Tahoma, sans-serif" font-size="28" fill="#38263e">API จัดอันดับ → เว็บแสดงผล</text><text x="700" y="790" font-family="Tahoma, sans-serif" font-size="22" fill="#38263e">เรียงผลในแต่ละแหล่งจากภาพ ร่วมกับพื้นที่และเวลาเมื่อมีข้อมูล</text><path d="M250 612 V710" fill="none" stroke="#806286" stroke-width="4" marker-end="url(#a)"/><path d="M720 612 V710" fill="none" stroke="#806286" stroke-width="4" marker-end="url(#a)"/></svg>